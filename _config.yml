# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: RL
subtitle: ''
description: ''
keywords:
author: rl
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
#
# 仓库名是 rl4594.github.io —— GitHub 的「用户站」约定名，站点在域名根上，
# 所以 url 不带路径、下面的 root 保持默认的 '/'（这一行没写，Hexo 默认就是 /）。
#
# 这个值会**原样拼进**文章永久链接、版权卡片的「文章链接」和 Open Graph 标签，
# 写错的话全站外链和分享预览都是坏的。改域名（或换成项目站）时三个地方一起看：
#   url          站点地址，不带结尾斜杠
#   root         站点在域名下的路径，根目录是 '/'，项目站是 '/<repo>/'
#   仓库名        用户站必须叫 <username>.github.io，其它名字就是项目站
url: https://rl4594.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Search index
## 由 hexo-generator-searchdb 生成，供 Butterfly 的本地搜索读取。
## 这里管的是「生成什么」，_config.butterfly.yml 的 search 段管的是
## 「导航栏要不要出现搜索按钮、结果怎么显示」。两处都要开才有效。
## 这一段不写也能跑（插件有默认值），写出来是为了把默认值钉住 ——
## 插件哪天改了默认 format，搜索结果的显示会跟着变，钉住就不会被牵连。
search:
  path: search.json
  # post = 只索引文章，不含独立页面（关于页之类不会被搜到）
  field: post
  content: true
  # striptags = 索引里存纯文本。搜索结果是把命中的片段直接标红显示的，
  # 存 HTML 的话还得再洗一遍，存纯文本更省事也更安全。
  format: striptags

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
#
# 发布方式是「本地构建 + 推到另一个分支」，需要 hexo-deployer-git（已装）。
#
# 分支怎么分的：
#   main       Hexo 源码（你在写的这些）
#   gh-pages   hexo deploy 推上去的**构建产物**，GitHub Pages 就是发布它
# 两边的 gitignore 互不影响：public/ 不进源码分支（.gitignore 里有），
# hexo deploy 会自动建一个 .deploy_git/ 暂存区去推 gh-pages（也被忽略了）。
#
# ⚠️ 推完之后必须去 GitHub 仓库的 Settings → Pages：
#   Source 选「Deploy from a branch」，Branch 选 gh-pages / (root)，保存。
# 不设的话站点是 404 —— 推上去的产物只是存在那儿，GitHub 不知道要发布它。
#
# 发布命令（两步都要，clean 是为了让主题的 Stylus 变量重新编译）：
#   npx hexo clean && npx hexo generate && npx hexo deploy
deploy:
  type: git
  repo: https://github.com/rl4594/rl4594.github.io.git
  branch: gh-pages
  # 提交信息。{{ now(...) }} 由 deployer 在推送时求值
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"
