  option:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:

# Structured Data
# https://developers.google.com/search/docs/guides/intro-structured-data
structured_data:
  enable: false
  # Alternate name for the site, used in structured data
  # Format: ['name1', 'name2']
  alternate_name:

# Add the vendor prefixes to ensure compatibility
css_prefix: true

# Inject
# Insert the code to head (before '</head>' tag) and the bottom (before '</body>' tag)
inject:
  head:
    # - <link rel="stylesheet" href="/xxx.css">
    # 思源黑体（正文/标题）+ JetBrains Mono（代码块）。
    # 只取 400 和 600 两个字重，刻意不加载 700 —— 这是调字重的唯一开关。
    # 主题把 h1-h6、b/strong、导航站名、代码块语言标签都写成 font-weight: bold(=700)，
    # 黑体的 700 在中文下比宋体压秤得多，整页会发闷。只提供到 600，这些规则就会
    # 按 CSS 字体匹配规则落到 600（不是合成加粗，笔画不会糊），全站统一降一档。
    # 还想更轻就把这里改成 500（500 那档已确认可下），改完要 hexo clean 重构建。
    # 用 fonts.loli.net 而不是 fonts.googleapis.com —— 后者国内直连不通。
    # 三家镜像返回的是同一份文件（同一批 unicode-range 分片），所以换哪家都行：
    #   fonts.loli.net        国内快，海外也能访问（当前用的）
    #   fonts.googleapis.cn   Google 自己的国内镜像
    #   fonts.googleapis.com  海外/部署到 GitHub Pages 时更稳
    # 换的时候记得把下面两行 preconnect 也一起换掉，否则预连接会白发一次。
    - '<link rel="preconnect" href="https://fonts.loli.net" crossorigin>'
    - '<link rel="preconnect" href="https://gstatic.loli.net" crossorigin>'
    - '<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">'
    # 全站自定义样式，源文件在 source/css/custom.css
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    # - <script src="xxxx"></script>
    # —— 给当前所在栏目加标记 ——
    # 主题不标当前页，这段小脚本把地址栏和菜单链接对一下，命中就给那一项
    # 加 .active，样式在 custom.css 的「3.1 菜单项」里。
    # 首页必须精确匹配，否则 '/' 会前缀命中所有页面。
    # 用 >- 折行写（YAML 会把换行折成空格），所以脚本里不能出现 // 注释 ——
    # 折完会把后面整行都注释掉。PJAX 是关的，每次加载都会重跑，不用额外监听。
    - >-
      <script>
      (function () {
        var path = location.pathname;
        var items = document.querySelectorAll("#nav .menus_items .menus_item > a.site-page");
        for (var i = 0; i < items.length; i++) {
          var href = items[i].getAttribute("href");
          if (!href) continue;
          var hit = href === "/"
            ? (path === "/" || path === "/index.html")
            : (path === href || path.indexOf(href) === 0);
          if (hit) items[i].classList.add("active");
        }
      })();
      </script>

