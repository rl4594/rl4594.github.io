# --------------------------------------
# Hexo Butterfly Theme Configuration
# If you have any questions, please refer to the documentation
# Chinese: https://butterfly.js.org/
# English: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# Navigation Settings
# --------------------------------------

nav:
  # Navigation bar logo image
  logo:
  display_title: true
  display_post_title: true
  # Whether to fix navigation bar
  # 开启后导航栏常驻顶部。滚动之后它会变成一条实心栏（样式见 custom.css
  # 第 3 节），靠一道软影和下面的内容分开。
  fixed: true

menu:
  # 格式：名称: 链接 || 图标
  # 二级菜单写法：名称||fas fa-list: 然后在其下缩进写子项
  # 图标名去 fontawesome.com 查（这里用的是免费版的 fas/far）
  #
  # 标签页和分类页需要 source/tags/index.md、source/categories/index.md
  # 存在（已经建好了，front-matter 里的 type 字段是关键，别删）；
  # 关于页是普通页面 source/about/index.md。
  # 想加二级菜单：把某一项写成 `更多||fas fa-list:` 再在下面缩进写子项。
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

# --------------------------------------
# Code Blocks Settings
# --------------------------------------

code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  # darker = Material Palenight 系配色（底 #212121，紫 #c792ea），和暮色紫同一挂
  theme: darker
  # 顶部三个红黄绿圆点，配 darker 像一块 macOS 终端
  macStyle: true
  # Code block height limit (unit: px)
  # 超过这个高度折叠，避免长代码把文章撑得没边
  height_limit: 520
  word_wrap: false

  # Toolbar
  copy: true
  language: true
  # true: shrink the code blocks | false: expand the code blocks | none: expand code blocks and hide the button
  shrink: false
  fullpage: false

# Social media links
# Formal:
#   icon: link || the description || color
social:
  # 格式：图标名: 链接 || 悬浮提示 || 颜色
  #
  # 这里**故意不写第三个字段**（颜色）。主题会把颜色写成 <i> 上的 inline
  # style，inline 压不过 —— 写死的品牌色在暗色模式下不会跟着变，GitHub 的
  # '#24292e' 压在深色卡片上等于隐形。省略之后图标用 var(--font-color)，
  # 也就是 custom.css 里的 --dusk-ink，亮暗两套自动切换。
  fab fa-github: https://github.com/rl4594 || Github
  fab fa-bilibili: https://space.bilibili.com/3691008309070538 || Bilibili

# --------------------------------------
# Image Settings
# --------------------------------------

favicon: /img/favicon.png

avatar:
  # 由 tools/build_assets.py 从 _originals/avatar.png 裁出来（正方形、240px），
  # 换头像请换那张原图再跑脚本，别直接改 source/img/avatar.webp
  img: /img/avatar.webp
  # 头像常驻旋转，是个很轻的动效（custom.css 第 14 节把速度放慢到 16 秒一圈）
  effect: true

# Disable all banner images
disable_top_img: false

# If the banner of page not setting, it will show the default_top_img
default_top_img: /img/wallpaper.webp

# The banner image of index page
index_img: /img/wallpaper.webp

# The banner image of archive page
archive_img: /img/wallpaper.webp

# Note: tag page, not tags page
tag_img:

# The banner image of tag page, you can set the banner image for each tag
# Format:
#  - tag name: xxxxx
tag_per_img:

# Note: category page, not categories page
category_img:

# The banner image of category page, you can set the banner image for each category
# Format:
#  - category name: xxxxx
category_per_img:

# The background image of footer
footer_img: false

# Website Background
# Can set it to color, image URL or an array containing colors and/or image URLs
# If an array is provided, a random background will be selected from the array on each load
#
# 壁纸不再是整站背景，只留在顶部横幅上（index_img / default_top_img）。
# 这里给的是一个颜色，主题会把它内联成 #web_bg 的 background-color。
#
# 但实际看到的不是这个颜色：source/css/custom.css 的 --page-gradient 在
# 它上面盖了一层暮色渐变（亮暗两种模式各一条）。那个渐变必须写在 CSS 里 ——
# 这个字段只能是一个值，主题的 getBgPath 只把 #/rgb/hsl 开头的当颜色，
# 其余一律塞进 background 简写，塞不下两条渐变。
#
# 所以这一行的作用是「CSS 没加载 / 被禁用时的兜底色」，值取亮色渐变的中段。
# 改渐变请改 custom.css，改这里不会有视觉效果。
background: '#F5F2FA'

cover:
  # Disable the cover or not
  index_enable: true
  aside_enable: true
  archives_enable: true
  # When cover is not set, the default cover is displayed
  # 五张图都是从 wallpaper.webp 上不同区域裁出来的，色系和横幅一致。
  # 文章超过一篇时主题会随机发、并避开最近用过的那几张。
  # 换壁纸后重新生成：python tools/build_assets.py
  default_cover:
    - /img/covers/night-sky.webp
    - /img/covers/star-river.webp
    - /img/covers/dusk-clouds.webp
    - /img/covers/petal-rail.webp
    - /img/covers/sunset-span.webp

# Replace Broken Images
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# A simple 404 page
error_404:
  enable: false
  subtitle: 'Page Not Found'
  background: /img/error-page.png

post_meta:
  # Home Page
  page:
    # Choose: created / updated / both
    date_type: created
    # Choose: date / relative
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    # Choose: left / center
    position: left
    # Choose: created / updated / both
    date_type: both
    # Choose: date / relative
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# Index page settings
# --------------------------------------

# The top_img settings of home page
# default: top img - full screen, site info - middle
# The position of site info, eg: 300px/300em/300rem/10%
index_site_info_top:
# The height of top_img, eg: 300px/300em/300rem
#
# 留空 = 100vh。100vh 的问题是常见笔记本（1280x800）下首屏整屏都是横幅，
# 一张卡片都看不到，每次进站都得先滚一下。70vh 让第一篇文章在首屏露出上半张卡。
# 注意这个值是**编译期**写进 CSS 的（主题的 var.styl），改完要重新 generate。
index_top_img_height: 70vh

# The subtitle on homepage
subtitle:
  # 首页横幅上站名下面那行字，打字机效果
  enable: true
  # Typewriter Effect
  #
  # 注意这个字段在主题里是**反着写的**：subtitle.pug 里判断的是
  # `if (!{effect})` —— 这不是 JS 取反，`!{}` 是 Pug 的非转义插值标记，
  # 整个表达式求值出来就是 `if (true)`。所以 effect: true 才是「开打字机」，
  # 别被那个感叹号骗了改成 false。
  #
  # true 时会动态加载 typed.js（主题 plugins.yml 里的 typed.js@3.0.0，
  # 走 CDN，实测可达）；拿不到的话副标题会是空的 —— 因为它只在拿到脚本之后
  # 才往 #subtitle 里写内容。
  effect: true
  # Customize typed.js
  # https://github.com/mattboldt/typed.js/#customization
  typed_option:
  # Source - Call the third-party service API (Chinese only)
  # It will show the source first, then show the content of sub
  # Choose: false/1/2/3
  # false - disable the function
  # 1 - hitokoto.cn
  # 2 - https://api.aa1.cn/doc/yiyan.html
  # 3 - jinrishici.com
  source: false
  # If you close the typewriter effect, the subtitle will only show the first line of sub
  #
  # 可以写成一个列表，打字机会在几条之间轮着打、打、删、再打：
  #   sub:
  #     - 第一条
  #     - 第二条
  # 写成一行就是只有一句，打完删掉再重来。
  sub: Hello World

# Article layout on the homepage
# 1: Cover on the left, info on the right
# 2: Cover on the right, info on the left
# 3: Cover and info alternate between left and right
# 4: Cover on top, info on the bottom
# 5: Info displayed on the cover
# 6: Masonry layout - Cover on top, info on the bottom
# 7: Masonry layout - Info displayed on the cover
index_layout: 3

# Display the article introduction on homepage
# 1: description
# 2: both (if the description exists, it will show description, or show the auto_excerpt)
# 3: auto_excerpt (default)
# false: do not show the article introduction
index_post_content:
  method: 3
  # If you set method to 2 or 3, the length need to config
  length: 500

# --------------------------------------
# Post Settings
# --------------------------------------

toc:
  post: true
  page: false
  number: true
  expand: false
  # Only for post
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Sponsor/reward
reward:
  enable: false
  text:
  QR_code:
    # - img: /img/wechat.jpg
    #   link:
    #   text: wechat
    # - img: /img/alipay.jpg
    #   link:
    #   text: alipay

# Post edit
# Easily browse and edit blog source code online.
post_edit:
  enable: false
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # For example: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url:

# Related Articles
related_post:
  enable: true
  # Number of posts displayed
  limit: 6
  # Choose: created / updated
  date_type: created

# Choose: 1 / 2 / false
# 1: The 'next post' will link to old post
# 2: The 'next post' will link to new post
# false: disable pagination
post_pagination: 1

# Displays outdated notice for a post
noticeOutdate:
  enable: false
  # Style: simple / flat
  style: flat
  # When will it be shown
  limit_day: 365
  # Position: top / bottom
  position: top
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# --------------------------------------
# Footer Settings
# --------------------------------------
footer:
  nav:
  owner:
    enable: true
    since: 2026
  # Copyright of theme and framework
  copyright:
    enable: true
    version: true
  custom_text:

# --------------------------------------
# Aside Settings
# --------------------------------------

aside:
  enable: true
  hide: false
  # Show the button to hide the aside in bottom right button
  button: true
  mobile: true
  # Position: left / right
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/rl4594
  card_announcement:
    enable: true
    content: 这是我的个人博客，当前还在建设中......
  card_recent_post:
    enable: true
    # If set 0 will show all
    limit: 5
    # Sort: date / updated
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    # Unit: mins, save data to localStorage
    storage: 10
    avatar: true
  card_categories:
    enable: true
    # If set 0 will show all
    limit: 8
    # Choose: none / true / false
    expand: none
    sort_order:
  card_tags:
    enable: true
    # If set 0 will show all
    limit: 40
    color: false
    custom_colors:
    # Order of tags, random/name/length
    orderby: random
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: 1
    sort_order:
  card_archives:
    enable: true
    # Type: monthly / yearly
    type: monthly
    # Eg: YYYY年MM月
    format: MMMM YYYY
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: -1
    # If set 0 will show all
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    # The title shows the series name
    series_title: false
    # Order by title or date
    orderBy: 'date'
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    # Time difference between publish date and now
    # Formal: Month/Day/Year Time or Year/Month/Day Time
    # Leave it empty if you don't enable this feature
    runtime_date:

# --------------------------------------
# Bottom right button
# --------------------------------------

# The distance between the bottom right button and the bottom (default unit: px)
rightside_bottom:

# Conversion between Traditional and Simplified Chinese
translate:
  enable: false
  # The text of a button
  default: 繁
  # the language of website (1 - Traditional Chinese/ 2 - Simplified Chinese）
  defaultEncoding: 2
  # Time delay
  translateDelay: 0
  # The text of the button when the language is Simplified Chinese
  msgToTraditionalChinese: '繁'
  # The text of the button when the language is Traditional Chinese
  msgToSimplifiedChinese: '簡'

# Read Mode
readmode: true

# Dark Mode
darkmode:
  enable: true
  # Toggle Button to switch dark/light mode
  button: true
  # Switch dark/light mode automatically
  # autoChangeMode: 1  Following System Settings, if the system doesn't support dark mode, it will switch dark mode between 6 pm to 6 am
  # autoChangeMode: 2  Switch dark mode between 6 pm to 6 am
  # autoChangeMode: false
  autoChangeMode: false
  # Set the light mode time. The value is between 0 and 24. If not set, the default value is 6 and 18
  start:
  end:

# Show scroll percent in scroll-to-top button
rightside_scroll_percent: true

# Don't modify the following settings unless you know how they work
# Choose: readmode,translate,darkmode,hideAside,toc,chat,comment
# Don't repeat the same value
rightside_item_order:
  enable: false
  # Default: readmode,translate,darkmode,hideAside
  hide:
  # Default: toc,chat,comment
  show:

# Animation for the bottom right config button
rightside_config_animation: true

# --------------------------------------
# Global Settings
# --------------------------------------

anchor:
  # When you scroll, the URL will update according to header id.
  auto_update: false
  # Click the headline to scroll and update the anchor
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true
  # Add the copyright information after copied content
  copyright:
    enable: false
    limit_count: 150

# Need to install the hexo-wordcount plugin
wordcount:
  enable: false
  # Display the word count of the article in post meta
  post_wordcount: true
  # Display the time to read the article in post meta
  min2read: true
  # Display the total word count of the website in aside's webinfo
  total_wordcount: true

# Busuanzi count for PV / UV in site
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# Math
# --------------------------------------

# About the per_page
# if you set it to true, it will load mathjax/katex script in each page
# if you set it to false, it will load mathjax/katex script according to your setting (add the 'mathjax: true' or 'katex: true' in page's front-matter)
math:
  # Choose: mathjax, katex
  # Leave it empty if you don't need math
  use:
  per_page: true
  hide_scrollbar: false

  mathjax:
    # Enable the contextual menu
    enableMenu: true
    # Choose: all / ams / none, This controls whether equations are numbered and how
    tags: none

  katex:
    # Enable the copy KaTeX formula
    copy_tex: false

# --------------------------------------
# Search
# --------------------------------------

search:
  # Choose: algolia_search / local_search / docsearch
  # leave it empty if you don't need search
  # local_search 需要 hexo-generator-searchdb（已装，见 package.json），
  # 它会在根目录生成 search.json；站点 _config.yml 里的 search 段控制生成什么。
  use: local_search
  # 留空用主题自带的中文文案
  placeholder:

  # Algolia Search
  algolia_search:
    # Number of search results per page
    hitsPerPage: 6

  # Local Search
  local_search:
    # Preload the search data when the page loads.
    # 站点还小（search.json 只有几 KB），预加载能让点搜索图标时立刻出结果，
    # 不用等一次请求。文章多了、json 变大之后再考虑关掉。
    preload: true
    # Show top n results per article, show all results by setting to -1
    top_n_per_article: 1
    # Unescape html strings to the readable one.
    unescape: false
    # Enable pagination for search results
    pagination:
      enable: false
      # Number of search results per page
      hitsPerPage: 8
    CDN:

  # Docsearch
  # https://docsearch.algolia.com/
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# Share System
# --------------------------------------

share:
  # Choose: sharejs / addtoany
  # Leave it empty if you don't need share
  use: sharejs

  # Share.js
  # https://github.com/overtrue/share.js
  sharejs:
    sites: facebook,x,wechat,weibo,qq

  # AddToAny
  # https://www.addtoany.com/
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# Comments System
# --------------------------------------

comments:
  # Up to two comments system, the first will be shown as default
  # Leave it empty if you don't need comments
  # Choose: Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  # Format of two comments system : Disqus,Waline
  use:
  # Display the comment name next to the button
  text: true
  # Lazyload: The comment system will be load when comment element enters the browser's viewport.
  # If you set it to true, the comment count will be invalid
  lazyload: false
  # Display comment count in post's top_img
  count: false
  # Display comment count in Home Page
  card_post_count: false

# Disqus
# https://disqus.com/
disqus:
  shortname:
  # For newest comments widget
  apikey:

# Alternative Disqus - Render comments with Disqus API
# https://github.com/SukkaW/DisqusJS
disqusjs:
  shortname:
  apikey:
  option:

# Livere
# https://www.livere.com/
livere:
  uid:

# Gitalk
# https://github.com/gitalk/gitalk
gitalk:
  client_id:
  client_secret:
  repo:
  owner:
  admin:
  option:

# Valine
# https://valine.js.org
valine:
  appId:
  appKey:
  avatar: monsterid
  # This configuration is suitable for domestic custom domain name users, overseas version will be automatically detected (no need to manually fill in)
  serverURLs:
  bg:
  # Use Valine visitor count as the page view count
  visitor: false
  option:

# Waline - A simple comment system with backend support fork from Valine
# https://waline.js.org/
waline:
  serverURL:
  bg:
  # Use Waline pageview count as the page view count
  pageview: false
  option:

# Utterances
# https://utteranc.es/
utterances:
  repo:
  # Issue Mapping: pathname/url/title/og:title
  issue_term: pathname
  # Theme: github-light/github-dark/github-dark-orange/icy-dark/dark-blue/photon-dark
  light_theme: github-light
  dark_theme: photon-dark
  js:
  option:

# Facebook Comments Plugin
# https://developers.facebook.com/docs/plugins/comments/
facebook_comments:
  app_id:
  # optional
  user_id:
  pageSize: 10
  # Choose: social / time / reverse_time
  order_by: social
  lang: en_US

# Twikoo
# https://github.com/imaegoo/twikoo
twikoo:
  envId:
  region:
  # Use Twikoo visitor count as the page view count
  visitor: false
  option:

# Giscus
# https://giscus.app/
giscus:
  repo:
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark
  js:
  option:

# Remark42
# https://remark42.com/docs/configuration/frontend/
remark42:
  host:
  siteId:
  option:

# Artalk
# https://artalk.js.org/guide/frontend/config.html
artalk:
  server:
  site:
  # Use Artalk visitor count as the page view count
  visitor: false
  option:

# --------------------------------------
# Chat Services
# --------------------------------------

chat:
  # Choose: chatra/tidio/crisp/knocket
  # Leave it empty if you don't need chat
  use:
  # Chat Button [recommend]
  # It will create a button in the bottom right corner of website, and hide the origin button
  rightside_button: false
  # The origin chat button is displayed when scrolling up, and the button is hidden when scrolling down
  button_hide_show: false

# https://chatra.io/
chatra:
  id:

# https://www.tidio.com/
tidio:
  public_key:

# https://crisp.chat/en/
crisp:
  website_id:

# https://trtc.io/solutions/knocket
knocket:
  identifier:

# --------------------------------------
# Analysis
# --------------------------------------

# https://tongji.baidu.com/web/welcome/login
baidu_analytics:

# https://analytics.google.com/analytics/web/
google_analytics:

# https://www.cloudflare.com/zh-tw/web-analytics/
cloudflare_analytics:

# https://clarity.microsoft.com/
microsoft_clarity:

# https://umami.is/
umami_analytics:
  enable: false
  # For self-hosted setups, configure the hostname of the Umami instance
  serverURL:
  script_name: script.js
  website_id:
  option:
  UV_PV:
    site_uv: false
    site_pv: false
    page_pv: false
    # Umami Cloud (API key) / self-hosted Umami (token)
    token:

# https://www.googletagmanager.com/
google_tag_manager:
  tag_id:
  # optional
  domain:

# --------------------------------------
# Advertisement
# --------------------------------------

# Google Adsense
google_adsense:
  enable: false
  auto_ads: true
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client:
  enable_page_level_ads: true

# Insert ads manually
# Leave it empty if you don't need ads
ad:
  # Insert ads in the index (every three posts)
  index:
  # Insert ads in aside
  aside:
  # Insert ads in the post (before pagination)
  post:

# --------------------------------------
# Verification
# --------------------------------------

site_verification:
  # - name: google-site-verification
  #   content: xxxxxx
  # - name: baidu-site-verification
  #   content: xxxxxxx

# --------------------------------------
# Beautify / Effect
# --------------------------------------

# Theme color for customize
# Notice: color value must in double quotes like "#000" or may cause error!

# 暮色紫 / 落日琥珀 —— 取自壁纸上半部的紫蓝夜空和右下角的落日。
#
# 注意 main 和 button_hover 都不是「原色」：
#   主色设计稿是 #7C6BF0，但它在白底正文上对比度只有 4.02:1，
#   够不到 WCAG AA 要求的 4.5:1。压深到 #6C5CE7 后是 4.86:1，肉眼几乎无差。
#   琥珀同理：#FFA45B 配白字只有 1.96:1，压到 #E8833A 后是 2.71:1，
#   虽然仍是悬停态（瞬时、非正文），但能好一点是一点。
# 主题的配色是编译期内联进 CSS 的，不走 CSS 变量，所以必须在这里改；
# 想微调对比度就动这两个值，custom.css 覆盖不到它们。
theme_color:
  enable: true
  main: "#6C5CE7"
  paginator: "#6C5CE7"
  button_hover: "#E8833A"
  text_selection: "#6C5CE7"
  link_color: "#6C5CE7"
  meta_color: "#7A7590"
  hr_color: "#B9B0F0"
  code_foreground: "#C2410C"
  code_background: "rgba(108, 92, 231, .07)"
  toc_color: "#6C5CE7"
  blockquote_padding_color: "#6C5CE7"
  blockquote_background_color: "#6C5CE7"
  scrollbar_color: "#B9B0F0"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

# The user interface setting of category and tag page
# Choose: index - same as Homepage UI / default - same as archives UI
# leave it empty or index
category_ui:
tag_ui:

# Rounded corners for UI elements
rounded_corners_ui: true

# Stretches the lines so that each line has equal width
text_align_justify: false

# Add a mask to the header and footer
mask:
  header: true
  footer: true

# Loading Animation
preloader:
  enable: false
  # source
  # 1. fullpage-loading
  # 2. pace (progress bar)
  source: 1
  # pace theme (see https://codebyzach.github.io/pace/)
  pace_css_url:

# Page Transition
enter_transitions: true

# Default display mode - light (default) / dark
display_mode: light

# Configuration for beautifying the content of the article
beautify:
  enable: false
  # Specify the field to beautify (site or post)
  field: post
  # Specify the icon to be used as a prefix for the title, such as '\f0c1'
  title_prefix_icon:
  # Specify the color of the title prefix icon, such as '#F47466'
  title_prefix_icon_color:

# Global font settings
# 字体文件由 inject.head 里的 fonts.loli.net 引入（见下），这里只声明字体栈。
# 主题把 font_family 原样 unquote 进 Stylus，所以整串 CSS 字体栈要一起写进来。
font:
  # 主题默认 14px，中文在 14px 下笔画会糊，16px 起才立得住
  global_font_size: 16px
  code_font_size: 14px
  # 思源黑体优先，后面依次是 macOS / Windows 的系统无衬线，
  # 用来自重 CDN 挂了时兜底 —— 最后一定要留一个通用族名
  font_family: '"Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif'
  code_font_family: '"JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace'

# Font settings for the site title and site subtitle
# font_link 留空：字体已经在上面的 inject 里全局加载过了，不必再引一次
blog_title_font:
  font_link:
  font_family: '"Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif'

# The setting of divider icon
hr_icon:
  enable: true
  # The unicode value of Font Awesome icon, such as '\3423'
  # \f06c = fa-leaf，呼应壁纸里飘落的叶子/花瓣；主题默认是 \f0c4
  icon: '\f06c'
  icon_top:

# Typewriter Effect
# https://github.com/disjukr/activate-power-mode
activate_power_mode:
  enable: false
  colorful: true
  shake: true
  mobile: false

# Background effects
# --------------------------------------

# canvas_ribbon
# See: https://github.com/hustcc/ribbon.js
canvas_ribbon:
  enable: false
  # The size of ribbon
  size: 150
  # The opacity of ribbon (0 ~ 1)
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

# Fluttering Ribbon
canvas_fluttering_ribbon:
  enable: false
  mobile: false

# canvas_nest
# https://github.com/hustcc/canvas-nest.js
#
# 全站的粒子效果：一堆缓慢漂移的点，靠近的点之间连一条线，鼠标附近的连线更强。
# 脚本是 butterfly-extsrc@1.1.6（走 CDN），它读下面这几个属性自建一个 canvas。
#
# 几个从脚本源码里读出来的实情，改参数前值得知道：
#
# 1. opacity 加在 **canvas 元素的 CSS opacity** 上（脚本里写成
#    style="...opacity:N"），不是烘进颜色。所以它对点是和线一起起作用的，
#    而且可以在这里之外的 CSS 里按亮暗模式覆盖 —— 见 custom.css 第 19 节。
# 2. color 只管**连线**。粒子点本身走 canvas 的默认 fillStyle，也就是黑色 ——
#    脚本从没给 fillStyle 赋过值。所以亮色下那些点是浅灰的点，暗色下几乎看不见，
#    这个差异不是配置错了。
# 3. zIndex 是负的，canvas 在内容底下。本站卡片是不透明的（毛玻璃那套已经去掉），
#    所以粒子只在页面两侧留白、卡片之间的缝、以及没有卡片的地方露出来 —— 它更像一层
#    背景纹理，不是盖在正文上的特效。
# 4. mobile: false 会在移动端整个不启用（脚本里按 UA 判断），这是性能考虑，别改。
canvas_nest:
  enable: true
  # 连线颜色，取调色板里的暮色紫 #6C5CE7
  color: '108,92,231'
  # 线的透明度。脚本里线的 alpha 本来就是 0.2~1.0（越近越实），乘上这个值之后
  # 才落到「看得出来但不抢戏」的区间。
  # 亮色下 0.5 是实拍调出来的：0.35 几乎看不见。暗色下这个值不够用，靠
  # custom.css 第 19 节的 filter 补，见那里的说明。
  opacity: 0.5
  zIndex: -1
  # 粒子数量。它们只在 77px 内互相连线（脚本里距离平方阈值 6000），
  # 所以数量直接决定线的密度。
  count: 90
  mobile: false

# Mouse click effects: fireworks
fireworks:
  enable: false
  zIndex: 9999
  mobile: false

# Mouse click effects: Heart symbol
click_heart:
  enable: false
  mobile: false

# Mouse click effects: words
clickShowText:
  enable: false
  text:
    # - I
    # - LOVE
    # - YOU
  fontSize: 15px
  random: false
  mobile: false

# --------------------------------------
# Lightbox Settings
# --------------------------------------

# Choose: fancybox / medium_zoom
# https://github.com/francoischalifour/medium-zoom
# https://fancyapps.com/fancybox/
# Leave it empty if you don't need lightbox
# medium_zoom 比 fancybox 轻得多，点文章里的图能放大看
lightbox: medium_zoom

# --------------------------------------
# Tag Plugins settings
# --------------------------------------

# Series
series:
  enable: false
  # Order by title or date
  orderBy: 'title'
  # Sort of order. 1, asc for ascending; -1, desc for descending
  order: 1
  number: true

# ABCJS - The ABC Music Notation Plugin
# https://github.com/paulrosen/abcjs
abcjs:
  enable: false
  per_page: true

# Mermaid
# https://github.com/mermaid-js/mermaid
mermaid:
  enable: false
  # Write Mermaid diagrams using code blocks
  code_write: false
  # built-in themes: default / forest / dark / neutral
  theme:
    light: default
    dark: dark
  # Enable "Open in New Tab" button to view diagram in a separate window
  open_in_new_tab: true
  # Enable zoom and pan interactions on diagrams
  zoom_pan: true

# chartjs
# see https://www.chartjs.org/docs/latest/
chartjs:
  enable: false
  # Do not modify unless you understand how they work.
  # The default settings are only used when the MD syntax is not specified.
  # General font color for the chart
  fontColor:
    light: 'rgba(0, 0, 0, 0.8)'
    dark: 'rgba(255, 255, 255, 0.8)'
  # General border color for the chart
  borderColor:
    light: 'rgba(0, 0, 0, 0.1)'
    dark: 'rgba(255, 255, 255, 0.2)'
  # Background color for scale labels on radar and polar area charts
  scale_ticks_backdropColor:
    light: 'transparent'
    dark: 'transparent'

# Note - Bootstrap Callout
note:
  # Note tag style values:
  #  - simple    bs-callout old alert style. Default.
  #  - modern    bs-callout new (v2-v3) alert style.
  #  - flat      flat callout style with background, like on Mozilla or StackOverflow.
  #  - disabled  disable all CSS styles import of note tag.
  style: flat
  icons: true
  border_radius: 3
  # Offset lighter of background in % for modern and flat styles (modern: -12 | 12; flat: -18 | 6).
  # Offset also applied to label tag variables. This option can work with disabled note tag.
  light_bg_offset: 0

